name: Build It
on:
  pull_request:
    branches: ["main"]

jobs:
  prodDeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install Deps
        run: npm ci
      - name: Build
        run: npm run build